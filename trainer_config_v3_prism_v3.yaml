behaviors:
  FrankaPickPlaceV3:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 4000000
    time_horizon: 256
    summary_freq: 10000
    checkpoint_interval: 250000
environment_parameters:
  lift_goal_m:
    curriculum:
      - name: PickPlace30cm
        value: 0.30
  # Avance manual tras revisar Lift en ambos extremos del rango.
  # Cambiar solo este valor a 2 o 3 con PPO detenido y reanudar el mismo run.
  prism_yaw_level:
    curriculum:
      - name: ManualOrientationLevel
        value: 1
  # Solo se aplica en el nivel 1; 0.50 da 62.5 % de episodios en los extremos.
  prism_focus_probability:
    curriculum:
      - name: FocusedEdgeSampling
        value: 0.50
engine_settings:
  time_scale: 1


