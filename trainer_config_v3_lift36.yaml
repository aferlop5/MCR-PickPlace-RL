behaviors:
  FrankaPickPlaceV3:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 10000
    checkpoint_interval: 250000
environment_parameters:
  lift_goal_m:
    curriculum:
      - name: Lift05cm
        completion_criteria:
          measure: reward
          behavior: FrankaPickPlaceV3
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 2.0
        value: 0.05
      - name: Lift10cm
        completion_criteria:
          measure: reward
          behavior: FrankaPickPlaceV3
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 2.0
        value: 0.10
      - name: Lift20cm
        completion_criteria:
          measure: reward
          behavior: FrankaPickPlaceV3
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 2.0
        value: 0.20
      - name: PickPlace30cm
        value: 0.30
engine_settings:
  time_scale: 1
